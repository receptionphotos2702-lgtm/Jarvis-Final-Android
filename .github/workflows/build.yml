name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libtinfo5

    - name: Install Buildozer and Cython Toolchain
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython>=0.29.33,<3.0" "Kivy>=2.2.0"

    - name: Automatically Configure Licenses & Package APK
      run: |
        # Sdkmanager configurations bypass
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        
        # Buildozer.spec permissions update pipelines
        sed -i.bak "s/# android.accept_sdk_license = False/android.accept_sdk_license = True/" buildozer.spec
        
        # Final native android debug action trigger
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_NET: y

    - name: Upload Finished Jarvis APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Android-APK
        path: bin/*.apk
