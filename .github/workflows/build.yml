name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libtinfo5 libtinfo6

    - name: Install Buildozer and Cython Toolchain
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython>=0.29.33,<3.0" "Kivy>=2.2.0"

    - name: Force Accept Licenses & Package Jarvis APK
      run: |
        # 1. SDK Manager layout configuration setup
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        
        # 2. Spec file me automated license acceptance parameter inject karna
        if [ -f buildozer.spec ]; then
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        fi
        
        # 3. GitHub ke native Android SDK tools ka use karke saare licenses ko manually force accept karna
        if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        elif [ -d "$ANDROID_HOME/tools/bin" ]; then
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
        fi
        
        # 4. Final execution pipeline with auto-yes injection
        yes | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_NET: y
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload Finished Jarvis APK File
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Android-APK
        path: bin/*.apk
